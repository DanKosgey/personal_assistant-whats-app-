name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          python -m black --check .
          isort --check-only .
          mypy --ignore-missing-imports server || true
      - name: Run tests
        run: pytest -q
      - name: Validate ngrok config (optional)
        if: ${{ secrets.NGROK_AUTHTOKEN != '' && secrets.NGROK_DOMAIN != '' }}
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_DOMAIN: ${{ secrets.NGROK_DOMAIN }}
          NGROK_REGION: ${{ secrets.NGROK_REGION || 'us' }}
        run: |
          echo "Secrets present; basic ngrok config validation passed"

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-ssh:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          APP_DIR: ${{ secrets.APP_DIR || '/opt/whatsapp-agent' }}
          IMAGE: ghcr.io/${{ github.repository }}:latest
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_DOMAIN: ${{ secrets.NGROK_DOMAIN }}
          NGROK_REGION: ${{ secrets.NGROK_REGION || 'us' }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "\
            set -euo pipefail; \
            mkdir -p ${APP_DIR}; \
            cd ${APP_DIR}; \
            if [ ! -f docker-compose.yml ]; then \
              echo 'docker-compose.yml not found in APP_DIR; please provision the server first.'; \
              exit 1; \
            fi; \
            export AGENT_IMAGE=${IMAGE}; \
            export NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}; \
            export NGROK_DOMAIN=${NGROK_DOMAIN}; \
            export NGROK_REGION=${NGROK_REGION}; \
            docker compose pull; \
            docker compose up -d --no-deps --build agent ngrok; \
          "

version: "3.9"

services:
  agent:
    image: ${AGENT_IMAGE:-whatsapp-agent:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ENV=production
      - PORT=8001
      - DISABLE_DB=${DISABLE_DB:-1}
    ports:
      - "${PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  proxy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - agent
    restart: unless-stopped

  # Optional MongoDB (enable by setting profile or editing env DISABLE_DB)
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    profiles: ["db"]
    restart: unless-stopped

  # Optional Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["db"]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
